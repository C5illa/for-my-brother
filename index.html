<!DOCTYPE HTML>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="shortcut icon" type="image/x-icon" href="assets/clock-favicon.png">
  <title>Since</title>
  </head>
<body>
  <div id="container">

    <div class="top">
      <h1>Our last conversation was...</h1>
    </div>

    <div id="clock">
      <p id="countdown"></p>
    </div>

    <div class="bottom">
      <h2>...ago</h2>
    </div>
   
    <div>
     <p class="sign">designed by</p>
     <img src="assets/logo.png" alt="logo">
    </div>

  </div>

<script>
var countDownDate = new Date("July 23, 2023 21:04:00").getTime();

var x = setInterval(function() {

  var now = new Date().getTime();
    
  var distance = now - countDownDate;
    
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
  if (hours <= 9) {
    hours = "0" + hours;
  }
  if (minutes <= 9) {
    minutes = "0" + minutes;
  }
  if (seconds <= 9) {
    seconds = "0" + seconds;
  }
  
  document.getElementById("countdown").innerHTML = days + "d  " + hours + "h "
  + minutes + "m  " + seconds + "s  ";
    
}, 1000);
  
 var div = document.getElementById("container");

function getRandomColor() {
  return "hsl(" + 360 * Math.random() + ',' +
             (25 + 70 * Math.random()) + '%,' + 
             (85 + 10 * Math.random()) + '%)'
}

function changeColor(){
  div.style.backgroundColor= getRandomColor();
}

setInterval(changeColor,1000);
  
</script>

</body>
</html>
